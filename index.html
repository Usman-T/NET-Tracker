<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NET 1 Prep</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d2021;--s1:#242627;--s2:#2c2e2d;--ln:#3c3836;--ln2:#504945;--fg:#ebdbb2;--mut:#a89984;--dim:#7c6f64;--or:#fe8019;--ye:#fabd2f;--gr:#b8bb26;--rd:#fb4934;--aq:#8ec07c;--bl:#83a598;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.d{font-family:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:880px;margin:0 auto;padding:22px 20px 90px}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--or);outline-offset:2px;border-radius:6px}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:18px}
.brand b{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1}.brand b i{font-style:normal;color:var(--or)}
.brand span{display:block;color:var(--mut);font-size:13px;margin-top:4px}
.act{display:flex;gap:8px;align-items:center;margin-left:auto}
.btn{display:inline-flex;gap:7px;align-items:center;background:none;border:1px solid var(--ln2);border-radius:9px;padding:7px 13px;font-size:13px;font-weight:600;transition:border-color .2s,background .2s,color .2s}
.btn:hover{border-color:var(--or);color:var(--or)}.btn svg{width:15px;height:15px}.btn.pri{background:var(--or);border-color:var(--or);color:#1d2021}.btn.pri:hover{background:var(--ye);border-color:var(--ye);color:#1d2021}
.btn.txt{border:0;padding:7px 4px;color:var(--dim)}.btn.txt:hover{color:var(--fg)}
.sv{font-size:12px;color:var(--dim);margin-right:4px}
nav{display:flex;gap:26px;border-bottom:1px solid var(--ln);margin-bottom:28px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{background:none;border:0;padding:12px 0;font-weight:600;color:var(--dim);position:relative;transition:color .2s}
nav button:hover{color:var(--fg)}nav button.on{color:var(--fg)}
nav button:after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--or);transform:scaleX(0);transition:transform .3s cubic-bezier(.2,.8,.2,1)}nav button.on:after{transform:scaleX(1)}
h2{margin:0;font-weight:700;font-size:13px;color:var(--mut);letter-spacing:.01em}
.hero{background:var(--s1);border:1px solid var(--ln);border-radius:20px;padding:26px 26px 24px}
.hero h1{margin:0 0 6px;font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.035em;line-height:1.08}
.hero p{margin:0;color:var(--mut)}
.pace{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:26px;margin-top:26px}
.meter .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.meter .top b{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}.meter .top b small{font-size:17px;color:var(--dim);font-weight:600}
.meter .top span{color:var(--mut);font-size:13px;font-weight:600}
.blocks{display:flex;flex-wrap:wrap;gap:5px}.blocks i{width:26px;height:12px;border-radius:4px;background:var(--ln);transition:background .35s,transform .35s cubic-bezier(.34,1.6,.64,1)}
.blocks i.f{background:var(--or);transform:scaleY(1.25)}.blocks.y i.f{background:var(--ye)}.blocks i.x{background:var(--gr)}
.week{display:flex;gap:8px;margin-top:24px;padding-top:20px;border-top:1px solid var(--ln);align-items:center}
.week .lab{flex:1;color:var(--mut);font-size:13px}.day{width:30px;text-align:center;font-size:11px;color:var(--dim)}.day i{display:block;width:30px;height:30px;border-radius:9px;margin-bottom:4px;background:var(--bg);border:1px solid var(--ln)}
.day.p i{background:rgba(254,128,25,.25);border-color:rgba(254,128,25,.5)}.day.m i{background:var(--gr);border-color:var(--gr)}.day.t i{border-color:var(--or)}.day.t{color:var(--fg)}
.sec{margin-top:34px}.sec>h2{margin-bottom:6px}
.task{display:flex;gap:14px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--ln);cursor:pointer}
.task .tx{flex:1;min-width:0}.task .tx b{font-weight:600;display:block;transition:color .3s}.task .tx small{color:var(--dim);font-size:12.5px}
.task.k .tx b{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--or)}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--s2);color:var(--mut)}.tag.ph{color:var(--bl)}.tag.ma{color:var(--aq)}.tag.sh{color:var(--ye)}
.cb{appearance:none;-webkit-appearance:none;margin:0;width:26px;height:26px;border:2px solid var(--ln2);border-radius:9px;position:relative;flex:none;cursor:pointer;background:var(--bg);transition:background .2s,border-color .2s}
.cb:hover{border-color:var(--or)}.cb:checked{background:var(--or);border-color:var(--or);animation:pop .4s}.cb.y:checked{background:var(--ye);border-color:var(--ye)}
.cb:after{content:'';position:absolute;left:8px;top:2px;width:7px;height:13px;border:solid #1d2021;border-width:0 3px 3px 0;transform:rotate(45deg) scale(0);transition:transform .3s cubic-bezier(.34,1.8,.64,1)}.cb:checked:after{transform:rotate(45deg) scale(1)}
.cb:before{content:'';position:absolute;inset:-2px;border-radius:10px;border:2px solid var(--or);opacity:0;pointer-events:none}.cb:checked:before{animation:rip .55s ease-out}
@keyframes pop{40%{transform:scale(.82)}70%{transform:scale(1.15)}}@keyframes rip{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(2.1)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:24px}
.stat b{display:block;font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1}.stat span{color:var(--mut);font-size:13px}
.bar{height:6px;background:var(--ln);border-radius:9px;position:relative;margin-top:10px}.bar i{display:block;height:100%;border-radius:9px;background:var(--or);transition:width .9s cubic-bezier(.2,.8,.2,1)}.bar.y i{background:var(--ye)}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);border-radius:2px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prog{margin-top:14px}.prog .row{font-size:13px;color:var(--mut);margin-bottom:2px}.prog .row b{color:var(--fg);font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:34px}
.fb{display:flex;gap:10px;margin-bottom:12px}.fb input{flex:1;background:var(--s1);border:1px solid var(--ln);border-radius:10px;padding:9px 13px;outline:0}.fb input:focus{border-color:var(--or)}.fb .btn.on{background:var(--or);border-color:var(--or);color:#1d2021}
details{border-bottom:1px solid var(--ln)}summary{list-style:none;cursor:pointer;padding:15px 2px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center}summary::-webkit-details-marker{display:none}
summary b{font-weight:600;font-size:16px}summary .m{color:var(--mut);font-size:13px;display:flex;gap:14px;align-items:center}summary .m em{font-style:normal;color:var(--ye)}summary .bar{grid-column:1/-1;margin-top:6px;height:4px}
.chev{width:14px;height:14px;transition:transform .3s;color:var(--dim)}details[open] .chev{transform:rotate(90deg);color:var(--or)}
.ok{color:var(--gr);font-size:12px;font-weight:700;margin-left:8px}
.chs{padding:2px 2px 18px}.chs .sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{height:34px;min-width:44px;padding:0 12px;border-radius:9px;border:1px solid var(--ln2);background:none;color:var(--mut);font-weight:700;font-size:13px;transition:all .25s cubic-bezier(.34,1.56,.64,1)}
.chip:hover{border-color:var(--ye);color:var(--ye)}.chip.d{background:var(--ye);border-color:var(--ye);color:#1d2021;transform:translateY(-1px)}
.mini{width:34px;height:34px;border-radius:9px;border:1px dashed var(--ln2);background:none;color:var(--dim);font-size:18px;line-height:1}.mini:hover{border-color:var(--or);color:var(--or)}
.empty{color:var(--dim);padding:26px 0}

dialog h3{margin:0 0 8px;font-size:19px}dialog p{margin:0 0 18px;color:var(--mut);font-size:14px}
.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,24px);background:var(--s2);border:1px solid var(--ln2);padding:10px 18px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;z-index:20;font-size:14px}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:560px){.hero{padding:20px}.wrap{padding:18px 14px 90px}.blocks i{width:22px}.sv{display:none}}
.bars{display:flex;gap:6px;align-items:flex-end;margin-top:14px}.bc{flex:1;text-align:center;font-size:11px;color:var(--dim)}.bc.t{color:var(--fg)}.bt{height:96px;position:relative;background:var(--s1);border-radius:7px;margin-bottom:6px;overflow:hidden}
.bt i{position:absolute;left:0;right:0;bottom:0;background:var(--or);border-radius:5px 5px 0 0;min-height:0;transition:height .8s cubic-bezier(.2,.8,.2,1)}.bt i.m{background:var(--gr)}.bt u{position:absolute;left:0;right:0;height:2px;background:var(--fg);opacity:.6}
.sub{margin-top:26px}.map{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:12px}.cl{display:flex;flex-wrap:wrap;gap:3px;max-width:104px;background:none;border:0;padding:5px;border-radius:8px;transition:background .2s}.cl:hover{background:var(--s2)}
.cl i{width:10px;height:10px;border-radius:3px;background:var(--ln)}.cl i.f{background:var(--or)}.cl i.s{border-radius:50%;background:none;box-shadow:inset 0 0 0 1.5px var(--ln2)}.cl i.s.f{background:var(--ye);box-shadow:none}
.pr{display:flex;align-items:center;gap:12px}.pr .bar{flex:1;margin:0;height:8px}.pr b{min-width:44px;text-align:right;font-size:15px;font-weight:700}

<button class="btn pri" id="bExp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 17v3h16v-3"/></svg>Export</button></div></header>
<nav id="nav"></nav><main id="main"></main></div>
<dialog id="dlg"><h3 id="dT"></h3><p id="dP"></p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="dNo">Cancel</button><button class="btn pri" id="dOk">Confirm</button></div></dialog>

 else if(t.dataset.add){const n=S.sheets.filter(x=>x.chapterId===t.dataset.add).length;S.sheets.push({id:uid('p'),chapterId:t.dataset.add,title:'Sheet '+(n+1),done:false,doneAt:null,notes:''});open.add(t.dataset.add);save();render()}

 else if(t.dataset.all){const c=t.dataset.all;[...S.lectures,...S.sheets].filter(x=>x.chapterId===c&&!x.done).forEach(x=>{x.done=true;x.doneAt=dstr()});open.add(c);save();render();toast('Chapter marked done')}};
$('#bExp').onclick=async()=>{const json=JSON.stringify(S,null,2),fn='net-tracker-'+dstr()+'.json';
 try{const dl=window.claude&&await claude.use('downloads');if(dl){await dl.save({filename:fn,data:new Blob([json],{type:'application/json'})});return}}catch(e){if(e&&e.code==='declined')return}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=fn;a.click()}catch(e){}
 try{await navigator.clipboard.writeText(json);toast('Backup copied to clipboard')}catch(e){}};
$('#bImp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;let d;
 try{d=check(JSON.parse(await f.text()))}catch(x){return toast('That file isn’t a valid tracker backup. Nothing was changed.')}
 const n=d.lectures.length,nd=d.lectures.filter(x=>x.done).length,p=d.sheets.length,pd=d.sheets.filter(x=>x.done).length;
 if(!await confirmD('Replace your current progress?',`This file has ${nd}/${n} lectures and ${pd}/${p} sheets done. Your current data is backed up first, so you can use “Undo import”.`,'Replace'))return;
 try{localStorage.setItem(PREV,JSON.stringify(S))}catch(x){}S=d;save();render();toast('Import complete')};
$('#bUndo').onclick=async()=>{try{const d=check(JSON.parse(localStorage.getItem(PREV)));S=d;localStorage.removeItem(PREV);save();render();toast('Restored previous data')}catch(x){toast('Nothing to restore')}};
render();
</script></body></html>
